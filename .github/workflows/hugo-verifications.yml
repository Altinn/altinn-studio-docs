name: Hugo Verifications

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

jobs:
  build:
    runs-on: self-hosted
    name: Build and Check links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: '0.162.0'
          extended: true 

      - name: Install npm dependencies
        # Designsystemet (CSS og web-komponenter) hentes fra node_modules av Hugo Pipes.
        run: npm ci

      - name: Build
        run: hugo

      - name: Build pagefind index
        run: npx -y pagefind --site "public"

      - name: Verify links
        uses: untitaker/hyperlink@9375bc4063712ad490d5eb3d54df0b6aade15e54 # 0.3.2
        with:
          args: public/ --check-anchors --sources content/
