<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Systemskisse for Altinn Autorisasjon</title>
  <desc id="desc">Oversikt over eksterne identitetsleverandører, applikasjonene i Altinn Autorisasjon, beskyttede tjenester og revisjonsloggen.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="event-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111827; }
      .boundary-title { font: 700 18px Arial, sans-serif; fill: #334155; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #111827; }
      .box-text { font: 14px Arial, sans-serif; fill: #334155; }
      .label { font: 13px Arial, sans-serif; fill: #334155; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .box { stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .event { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#event-arrow); }
    </style>
  </defs>

  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="700" y="36" text-anchor="middle" class="title">Altinn Autorisasjon – systemoversikt</text>

  <rect x="25" y="85" width="215" height="675" rx="14" fill="#f0fdf4" stroke="#65a30d" stroke-width="2"/>
  <text x="132" y="116" text-anchor="middle" class="boundary-title">Eksterne tjenester</text>

  <rect x="270" y="60" width="865" height="750" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="296" y="94" class="boundary-title">Team Autorisasjon</text>

  <rect x="1170" y="85" width="205" height="675" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1272" y="116" text-anchor="middle" class="boundary-title">Konsumenter</text>

  <rect x="55" y="155" width="155" height="78" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="132" y="185" text-anchor="middle" class="box-title">ID-porten</text>
  <text x="132" y="207" text-anchor="middle" class="box-text">Personidentitet</text>

  <rect x="55" y="270" width="155" height="78" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="132" y="300" text-anchor="middle" class="box-title">Maskinporten</text>
  <text x="132" y="322" text-anchor="middle" class="box-text">Systemidentitet</text>

  <rect x="55" y="385" width="155" height="78" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="132" y="415" text-anchor="middle" class="box-title">FEIDE/UIDP</text>
  <text x="132" y="437" text-anchor="middle" class="box-text">Føderert identitet</text>

  <rect x="55" y="555" width="155" height="92" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="132" y="585" text-anchor="middle" class="box-title">Registerkilder</text>
  <text x="132" y="608" text-anchor="middle" class="box-text">Personer, virksomheter</text>
  <text x="132" y="628" text-anchor="middle" class="box-text">og eksterne roller</text>

  <rect x="320" y="135" width="225" height="105" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="432" y="168" text-anchor="middle" class="box-title">Authentication</text>
  <text x="432" y="193" text-anchor="middle" class="box-text">Innlogging, sesjon</text>
  <text x="432" y="214" text-anchor="middle" class="box-text">og tokenutveksling</text>

  <rect x="610" y="135" width="225" height="105" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="722" y="168" text-anchor="middle" class="box-title">Register</text>
  <text x="722" y="193" text-anchor="middle" class="box-text">Part, rolle</text>
  <text x="722" y="214" text-anchor="middle" class="box-text">og representasjon</text>

  <rect x="900" y="135" width="190" height="105" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="995" y="168" text-anchor="middle" class="box-title">Resource Registry</text>
  <text x="995" y="193" text-anchor="middle" class="box-text">Ressurser, handlinger</text>
  <text x="995" y="214" text-anchor="middle" class="box-text">og policytilknytning</text>

  <rect x="320" y="355" width="225" height="105" class="box" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="432" y="388" text-anchor="middle" class="box-title">System User</text>
  <text x="432" y="413" text-anchor="middle" class="box-text">Registrerte systemer</text>
  <text x="432" y="434" text-anchor="middle" class="box-text">og systembrukere</text>

  <rect x="610" y="335" width="225" height="145" class="box" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="722" y="370" text-anchor="middle" class="box-title">Access Management</text>
  <text x="722" y="395" text-anchor="middle" class="box-text">Roller, tilganger</text>
  <text x="722" y="416" text-anchor="middle" class="box-text">og delegeringer</text>
  <text x="722" y="447" text-anchor="middle" class="box-text">Samtykke og</text>
  <text x="722" y="468" text-anchor="middle" class="box-text">tilgangspakker</text>

  <rect x="900" y="355" width="190" height="105" class="box" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="995" y="388" text-anchor="middle" class="box-title">Authorization/PDP</text>
  <text x="995" y="413" text-anchor="middle" class="box-text">Policy- og</text>
  <text x="995" y="434" text-anchor="middle" class="box-text">tilgangsbeslutning</text>

  <rect x="610" y="625" width="225" height="105" class="box" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="722" y="658" text-anchor="middle" class="box-title">Audit Log</text>
  <text x="722" y="683" text-anchor="middle" class="box-text">Autentiserings- og</text>
  <text x="722" y="704" text-anchor="middle" class="box-text">autorisasjonshendelser</text>

  <rect x="1195" y="175" width="155" height="88" class="box" fill="#fff2cc" stroke="#d6b656"/>
  <text x="1272" y="207" text-anchor="middle" class="box-title">Altinn Apps</text>
  <text x="1272" y="231" text-anchor="middle" class="box-text">PEP og beskyttede</text>
  <text x="1272" y="251" text-anchor="middle" class="box-text">ressurser</text>

  <rect x="1195" y="330" width="155" height="88" class="box" fill="#fff2cc" stroke="#d6b656"/>
  <text x="1272" y="362" text-anchor="middle" class="box-title">Fellesløsninger</text>
  <text x="1272" y="386" text-anchor="middle" class="box-text">API-er som bruker</text>
  <text x="1272" y="406" text-anchor="middle" class="box-text">autorisasjon</text>

  <rect x="1195" y="485" width="155" height="88" class="box" fill="#fff2cc" stroke="#d6b656"/>
  <text x="1272" y="517" text-anchor="middle" class="box-title">Arbeidsflate</text>
  <text x="1272" y="541" text-anchor="middle" class="box-text">Administrerer</text>
  <text x="1272" y="561" text-anchor="middle" class="box-text">tilganger</text>

  <path d="M210 194 H320" class="flow"/><text x="265" y="184" text-anchor="middle" class="label">identitet</text>
  <path d="M210 309 H275 V210 H320" class="flow"/>
  <path d="M210 424 H275 V220 H320" class="flow"/>
  <path d="M545 188 H610" class="flow"/><text x="578" y="177" text-anchor="middle" class="label">oppslag</text>
  <path d="M210 601 H610" class="flow"/><text x="410" y="591" text-anchor="middle" class="label">registerdata</text>
  <path d="M432 240 V355" class="flow"/><text x="443" y="300" class="label">kontekst</text>
  <path d="M545 407 H610" class="flow"/>
  <path d="M722 240 V335" class="flow"/><text x="733" y="291" class="label">part og roller</text>
  <path d="M900 188 H835" class="flow"/>
  <path d="M995 240 V355" class="flow"/><text x="1006" y="301" class="label">policy</text>
  <path d="M835 407 H900" class="flow"/><text x="867" y="397" text-anchor="middle" class="label">rettigheter</text>
  <path d="M1090 407 H1150 V219 H1195" class="flow"/><text x="1142" y="295" text-anchor="end" class="label">beslutning</text>
  <path d="M1090 407 H1195" class="flow"/>
  <path d="M835 407 H1140 V529 H1195" class="flow"/><text x="1025" y="520" text-anchor="middle" class="label">administrasjon</text>
  <path d="M432 460 V677 H610" class="event"/>
  <path d="M722 480 V625" class="event"/><text x="734" y="558" class="label">hendelser</text>
  <path d="M995 460 V677 H835" class="event"/>

  <text x="700" y="834" text-anchor="middle" class="box-text">Heltrukne piler viser synkrone kall eller dataflyt. Stiplede lilla piler viser revisjonshendelser.</text>
</svg>
