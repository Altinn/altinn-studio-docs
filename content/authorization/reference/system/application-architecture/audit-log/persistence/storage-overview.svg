<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760" role="img"><title>Audit Log storage overview</title><style>.bg{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 19px system-ui;fill:#fff}.t{font:15px system-ui;fill:#172033}.n{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect class="bg" width="1700" height="760"/><g transform="translate(40 80)"><rect class="b" width="390" height="170" rx="8"/><rect width="390" height="44" rx="8" fill="#6d4c8d"/><text class="h" x="15" y="29">Queue: eventlog</text><text class="t" x="15" y="85">Authentication events</text><text class="n" x="15" y="120">JSON payload</text></g><g transform="translate(40 400)"><rect class="b" width="390" height="190" rx="8"/><rect width="390" height="44" rx="8" fill="#6d4c8d"/><text class="h" x="15" y="29">Queue: authorizationeventlog</text><text class="t" x="15" y="85">Authorisation decisions</text><text class="n" x="15" y="120">Legacy JSON or versioned payload</text><text class="n" x="15" y="150">Version 01: Brotli-compressed JSON</text></g><g transform="translate(590 235)"><rect class="b" width="420" height="220" rx="8"/><rect width="420" height="44" rx="8" fill="#1e3a5f"/><text class="h" x="15" y="29">Processors and Audit Log API</text><text class="t" x="15" y="87">Azure Functions read queues</text><text class="t" x="15" y="122">HTTP API validates events</text><text class="t" x="15" y="157">Repositories insert rows</text></g><g transform="translate(1170 80)"><rect class="b" width="480" height="230" rx="8"/><rect width="480" height="44" rx="8" fill="#0f766e"/><text class="h" x="15" y="29">PostgreSQL · authentication</text><text class="t" x="15" y="87">eventlogv1 + monthly partitions</text><text class="n" x="15" y="122">Authentication events and lookups</text><text class="n" x="15" y="160">Legacy eventlog: TimescaleDB hypertable</text></g><g transform="translate(1170 405)"><rect class="b" width="480" height="230" rx="8"/><rect width="480" height="44" rx="8" fill="#0f766e"/><text class="h" x="15" y="29">PostgreSQL · authz</text><text class="t" x="15" y="87">eventlogv1 + monthly partitions</text><text class="n" x="15" y="122">Authorisation decisions and context</text><text class="n" x="15" y="160">Legacy eventlog: TimescaleDB hypertable</text></g><path class="a" d="M430 165C500 165 520 295 580 295"/><path class="a" d="M430 495C500 495 520 395 580 395"/><path class="a" d="M1010 305C1080 305 1090 195 1160 195"/><path class="a" d="M1010 385C1080 385 1090 520 1160 520"/><text class="n" x="40" y="715">Source commit c070a2c · no blob storage is used by the analysed persistence implementation.</text></svg>