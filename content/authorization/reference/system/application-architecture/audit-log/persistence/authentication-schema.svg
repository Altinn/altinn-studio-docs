<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050" role="img"><title>Authentication schema in Audit Log</title><style>.bg{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.h1{fill:#0f766e}.old{fill:#64748b}.h{font:700 18px system-ui;fill:#fff}.t{font:14px ui-monospace,monospace;fill:#172033}.n{font:13px system-ui;fill:#475569}.a{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect class="bg" width="1900" height="1050"/><text x="45" y="42" class="h" style="fill:#172033">PostgreSQL schema: authentication</text><g transform="translate(45 90)"><rect class="b" width="690" height="560" rx="8"/><rect class="h1" width="690" height="44" rx="8"/><text class="h" x="15" y="29">eventlogv1 · active partitioned table</text><text class="t" x="15" y="80">sessionid text                 externalsessionid text</text><text class="t" x="15" y="114">subscriptionkey text           externaltokenissuer text</text><text class="t" x="15" y="148">created timestamptz NOT NULL   userid integer</text><text class="t" x="15" y="182">supplierid text                orgnumber integer</text><text class="t" x="15" y="216">FK eventtypeid integer</text><text class="t" x="15" y="250">FK authenticationmethodid integer</text><text class="t" x="15" y="284">FK authenticationlevelid integer</text><text class="t" x="15" y="318">ipaddress text                 isauthenticated boolean NOT NULL</text><text class="n" x="15" y="370">PARTITION BY RANGE (created)</text><text class="n" x="15" y="405">Index on created · monthly child tables</text><text class="n" x="15" y="450">Foreign keys are NOT VALID</text></g><g transform="translate(900 90)"><rect class="b" width="450" height="180" rx="8"/><rect class="h1" width="450" height="44" rx="8"/><text class="h" x="15" y="29">authenticationeventtype</text><text class="t" x="15" y="88">PK authenticationeventtypeid integer</text><text class="t" x="15" y="122">name text · description text</text></g><g transform="translate(900 340)"><rect class="b" width="450" height="180" rx="8"/><rect class="h1" width="450" height="44" rx="8"/><text class="h" x="15" y="29">authenticationmethod</text><text class="t" x="15" y="88">PK authenticationmethodid integer</text><text class="t" x="15" y="122">name text · description text</text></g><g transform="translate(900 590)"><rect class="b" width="450" height="180" rx="8"/><rect class="h1" width="450" height="44" rx="8"/><text class="h" x="15" y="29">authenticationlevel</text><text class="t" x="15" y="88">PK authenticationlevelid integer</text><text class="t" x="15" y="122">name text · description text</text></g><path class="a" d="M735 306C820 306 820 180 890 180"/><path class="a" d="M735 340H890"/><path class="a" d="M735 375C820 375 820 680 890 680"/><g transform="translate(1435 270)"><rect class="b" width="420" height="285" rx="8"/><rect class="old" width="420" height="44" rx="8"/><text class="h" x="15" y="29">eventlog · legacy</text><text class="t" x="15" y="85">Same event columns</text><text class="t" x="15" y="120">TimescaleDB hypertable</text><text class="t" x="15" y="155">time column: created</text><text class="t" x="15" y="190">chunk interval: 1 year</text><text class="n" x="15" y="240">Not used by the active repository</text></g><text class="n" x="45" y="1000">The migration creates no primary key on either event-log table. Monthly partition tables inherit the eventlogv1 structure.</text></svg>