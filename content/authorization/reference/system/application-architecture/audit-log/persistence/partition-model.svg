<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="720" viewBox="0 0 1700 720" role="img"><title>Audit Log monthly partition model</title><style>.bg{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 18px system-ui;fill:#fff}.t{font:15px system-ui;fill:#172033}.m{font:14px ui-monospace,monospace;fill:#172033}.n{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect class="bg" width="1700" height="720"/><g transform="translate(45 220)"><rect class="b" width="390" height="210" rx="8"/><rect width="390" height="44" rx="8" fill="#1e3a5f"/><text class="h" x="15" y="29">PartitionCreationHostedService</text><text class="t" x="15" y="85">Runs at startup and daily</text><text class="t" x="15" y="120">Manages both schemas</text><text class="n" x="15" y="160">Optional deletion uses environment</text><text class="n" x="15" y="185">retention configuration</text></g><g transform="translate(560 80)"><rect class="b" width="480" height="490" rx="8"/><rect width="480" height="44" rx="8" fill="#0f766e"/><text class="h" x="15" y="29">authentication.eventlogv1</text><text class="m" x="20" y="95">eventlogv1_yYYYYmMM</text><text class="n" x="20" y="125">previous month</text><text class="m" x="20" y="190">eventlogv1_yYYYYmMM</text><text class="n" x="20" y="220">current month</text><text class="m" x="20" y="285">eventlogv1_yYYYYmMM</text><text class="n" x="20" y="315">next month</text><text class="t" x="20" y="385">RANGE (created)</text><text class="n" x="20" y="420">One calendar month per child table</text></g><g transform="translate(1170 80)"><rect class="b" width="480" height="490" rx="8"/><rect width="480" height="44" rx="8" fill="#0f766e"/><text class="h" x="15" y="29">authz.eventlogv1</text><text class="m" x="20" y="95">eventlogv1_yYYYYmMM</text><text class="n" x="20" y="125">previous month</text><text class="m" x="20" y="190">eventlogv1_yYYYYmMM</text><text class="n" x="20" y="220">current month</text><text class="m" x="20" y="285">eventlogv1_yYYYYmMM</text><text class="n" x="20" y="315">next month</text><text class="t" x="20" y="385">RANGE (created)</text><text class="n" x="20" y="420">One calendar month per child table</text></g><path class="a" d="M435 290H550"/><path class="a" d="M435 365C750 650 1000 650 1160 365"/><text class="n" x="45" y="670">Old partitions are dropped only when EnableOldPartitionDeletion is true; RetentionMonths supplies the cutoff.</text></svg>