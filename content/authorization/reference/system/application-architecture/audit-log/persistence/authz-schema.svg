<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="930" viewBox="0 0 1850 930" role="img"><title>Authorisation schema in Audit Log</title><style>.bg{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.h1{fill:#0f766e}.old{fill:#64748b}.h{font:700 18px system-ui;fill:#fff}.t{font:14px ui-monospace,monospace;fill:#172033}.n{font:13px system-ui;fill:#475569}.a{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect class="bg" width="1850" height="930"/><text x="45" y="42" class="h" style="fill:#172033">PostgreSQL schema: authz</text><g transform="translate(45 90)"><rect class="b" width="790" height="650" rx="8"/><rect class="h1" width="790" height="44" rx="8"/><text class="h" x="15" y="29">eventlogv1 · active partitioned table</text><text class="t" x="15" y="82">sessionid text                 created timestamptz NOT NULL</text><text class="t" x="15" y="118">subjectuserid integer          subjectorgcode text</text><text class="t" x="15" y="154">subjectorgnumber integer       subjectparty integer</text><text class="t" x="15" y="190">resourcepartyid integer        resource text</text><text class="t" x="15" y="226">instanceid text                operation text</text><text class="t" x="15" y="262">ipaddress text</text><text class="t" x="15" y="298">contextrequestjson jsonb</text><text class="t" x="15" y="334">FK decision integer</text><text class="t" x="15" y="370">subject_party_uuid varchar(255)</text><text class="n" x="15" y="425">PARTITION BY RANGE (created)</text><text class="n" x="15" y="460">Index on created · monthly child tables</text><text class="n" x="15" y="495">Decision foreign key is NOT VALID</text><text class="n" x="15" y="545">No primary key is defined</text></g><g transform="translate(1000 120)"><rect class="b" width="470" height="230" rx="8"/><rect class="h1" width="470" height="44" rx="8"/><text class="h" x="15" y="29">decision</text><text class="t" x="15" y="90">PK decisionid integer</text><text class="t" x="15" y="126">name text</text><text class="t" x="15" y="162">description text</text><text class="n" x="15" y="200">Permit · Deny · Indeterminate · NotApplicable</text></g><path class="a" d="M835 425C930 425 920 235 990 235"/><g transform="translate(1000 500)"><rect class="b" width="700" height="280" rx="8"/><rect class="old" width="700" height="44" rx="8"/><text class="h" x="15" y="29">eventlog · legacy</text><text class="t" x="15" y="88">Same original columns, except subject_party_uuid</text><text class="t" x="15" y="126">TimescaleDB hypertable · time column: created</text><text class="t" x="15" y="164">Chunk interval: 1 year</text><text class="n" x="15" y="220">Not used by the active repository</text></g><text class="n" x="45" y="880">Monthly partition tables inherit the eventlogv1 structure. The context request is stored as JSONB.</text></svg>