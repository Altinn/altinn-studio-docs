<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img"><title>Register storage overview</title><style>.b{fill:#f7f8fa}.c{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 21px system-ui;fill:#fff}.t{font:16px system-ui;fill:#172033}.s{font:14px system-ui;fill:#475569}</style><rect class="b" width="1400" height="560"/><g transform="translate(35 45)"><rect class="c" width="300" height="135" rx="8"/><rect width="300" height="42" rx="8" fill="#1e3a5f"/><text class="h" x="16" y="28">Register services</text><text class="t" x="16" y="76">Npgsql persistence</text><text class="t" x="16" y="105">Import and saga workers</text></g><g transform="translate(390 25)"><rect class="c" width="460" height="265" rx="8"/><rect width="460" height="42" rx="8" fill="#0f766e"/><text class="h" x="16" y="28">PostgreSQL</text><text class="t" x="16" y="78">register schema · 20 application tables</text><text class="s" x="16" y="110">Parties, identities and source references</text><text class="s" x="16" y="138">External roles and event history</text><text class="s" x="16" y="166">Import, saga, leases and rate limits</text><text class="s" x="16" y="194">Country and municipality reference data</text><text class="t" x="16" y="230">Shared Quartz schema · 11 infrastructure tables</text></g><g transform="translate(390 330)"><rect class="c" width="460" height="145" rx="8"/><rect width="460" height="42" rx="8" fill="#8a4b08"/><text class="h" x="16" y="28">Azure Storage Queues</text><text class="t" x="16" y="80">Queue and poison queue for background work</text><text class="s" x="16" y="112">Names vary by environment</text></g><g transform="translate(910 125)"><rect class="c" width="440" height="170" rx="8" stroke-dasharray="8 5"/><rect width="440" height="42" rx="8" fill="#64748b"/><text class="h" x="16" y="28">Azure Blob Storage</text><text class="t" x="16" y="82">No application-owned blob containers</text><text class="s" x="16" y="116">No blob client usage found in source</text><text class="s" x="16" y="142">commit 8d34dbf</text></g><path d="M335 110H385" stroke="#64748b" stroke-width="2"/><path d="M335 145Q360 400 385 400" fill="none" stroke="#64748b" stroke-width="2"/><text class="s" x="35" y="530">Scope: persistent storage directly used or migrated by Altinn Register.</text></svg>