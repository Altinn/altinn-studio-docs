<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img"><title>Access-list model in the resourceregistry schema</title><style>.bg{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.hd{fill:#1e3a5f}.eh{fill:#9a3412}.h{font:700 18px system-ui;fill:#fff}.t{font:14px ui-monospace,monospace;fill:#172033}.n{font:13px system-ui;fill:#475569}.fk{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#a)}.lg{stroke:#9a3412;stroke-width:2.5;stroke-dasharray:9 6;fill:none;marker-end:url(#o)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker></defs><rect class="bg" width="1900" height="1120"/><text x="45" y="42" class="h" style="fill:#172033">PostgreSQL schema: resourceregistry · event-sourced access lists</text><g transform="translate(45 90)"><rect class="b" width="575" height="430" rx="7"/><rect class="eh" width="575" height="44" rx="7"/><text class="h" x="15" y="29">access_list_events</text><text class="t" x="15" y="78">PK eid                    bigint identity</text><text class="t" x="15" y="110">   etime                  timestamptz NOT NULL</text><text class="t" x="15" y="142">   kind                   access_list_event_kind</text><text class="t" x="15" y="174">   aggregate_id           uuid NOT NULL</text><text class="t" x="15" y="206">   identifier             text</text><text class="t" x="15" y="238">   name                   text</text><text class="t" x="15" y="270">   description            text</text><text class="t" x="15" y="302">   resource_owner         text</text><text class="t" x="15" y="334">   actions                text[]</text><text class="t" x="15" y="366">   party_ids              uuid[]</text><text class="n" x="15" y="405">Append-oriented log · index on aggregate_id</text></g><g transform="translate(765 90)"><rect class="b" width="565" height="345" rx="7"/><rect class="hd" width="565" height="44" rx="7"/><text class="h" x="15" y="29">access_list_state</text><text class="t" x="15" y="78">PK aggregate_id           uuid</text><text class="t" x="15" y="110">UQ identifier             text NOT NULL</text><text class="t" x="15" y="142">UQ resource_owner         text NOT NULL</text><text class="t" x="15" y="174">   name                   text NOT NULL</text><text class="t" x="15" y="206">   description            text NOT NULL</text><text class="t" x="15" y="238">   created                timestamptz NOT NULL</text><text class="t" x="15" y="270">   modified               timestamptz NOT NULL</text><text class="t" x="15" y="302">   version                bigint NOT NULL</text><text class="n" x="15" y="330">Unique pair: resource_owner + identifier</text></g><path class="lg" d="M620 220H755"/><text class="n" x="635" y="202">aggregate_id (logical)</text><g transform="translate(1450 90)"><rect class="b" width="400" height="170" rx="7"/><rect class="hd" width="400" height="44" rx="7"/><text class="h" x="15" y="29">resource_identifier</text><text class="t" x="15" y="82">PK identifier   text</text><text class="n" x="15" y="120">Referenced resource identity</text></g><g transform="translate(170 690)"><rect class="b" width="610" height="235" rx="7"/><rect class="hd" width="610" height="44" rx="7"/><text class="h" x="15" y="29">access_list_members_state</text><text class="t" x="15" y="82">PK/FK aggregate_id        uuid</text><text class="t" x="15" y="118">PK    party_id            uuid</text><text class="t" x="15" y="154">      since               timestamptz NOT NULL</text><text class="n" x="15" y="198">Cascade delete from access_list_state</text></g><g transform="translate(990 640)"><rect class="b" width="730" height="310" rx="7"/><rect class="hd" width="730" height="44" rx="7"/><text class="h" x="15" y="29">access_list_resource_connections_state</text><text class="t" x="15" y="82">PK/FK aggregate_id        uuid</text><text class="t" x="15" y="118">PK/FK resource_identifier text</text><text class="t" x="15" y="154">      actions             text[] NOT NULL</text><text class="t" x="15" y="190">      created             timestamptz NOT NULL</text><text class="t" x="15" y="226">      modified            timestamptz NOT NULL</text><text class="n" x="15" y="270">Cascade delete from list; restrict resource delete</text></g><path class="fk" d="M475 690V590H900V445"/><path class="fk" d="M1250 640V560H1080V445"/><path class="lg" d="M1550 640V280"/><text class="n" x="45" y="1070">Blue arrows: enforced foreign keys · orange dashed arrows: logical relations without foreign keys.</text></svg>