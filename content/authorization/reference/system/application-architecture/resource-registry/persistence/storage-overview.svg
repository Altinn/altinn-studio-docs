<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img"><title>Resource Registry storage overview</title><style>.bg{fill:#f7f8fa}.c{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 20px system-ui;fill:#fff}.t{font:15px system-ui;fill:#172033}.s{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect class="bg" width="1600" height="700"/><g transform="translate(40 230)"><rect class="c" width="300" height="150" rx="8"/><rect width="300" height="44" rx="8" fill="#1e3a5f"/><text class="h" x="16" y="29">Resource Registry</text><text class="t" x="16" y="82">Repositories and services</text><text class="s" x="16" y="112">Metadata, policies, access lists</text><text class="s" x="16" y="134">and resource subjects</text></g><g transform="translate(440 75)"><rect class="c" width="500" height="330" rx="8"/><rect width="500" height="44" rx="8" fill="#0f766e"/><text class="h" x="16" y="29">PostgreSQL</text><text class="t" x="16" y="85">Schema: resourceregistry</text><text class="s" x="16" y="116">resource_identifier · durable identity and feed state</text><text class="s" x="16" y="145">resources · versioned metadata</text><text class="s" x="16" y="174">resourcesubjects · derived policy subjects</text><text class="s" x="16" y="203">access_list_events · append-oriented event log</text><text class="s" x="16" y="232">three access-list state tables</text><text class="t" x="16" y="281">View: current_resources</text><text class="s" x="16" y="310">Latest metadata version per identifier</text></g><g transform="translate(1035 55)"><rect class="c" width="515" height="180" rx="8"/><rect width="515" height="44" rx="8" fill="#6d4c8d"/><text class="h" x="16" y="29">Resource Registry blob account</text><text class="t" x="16" y="86">ResourceRegistryContainer</text><text class="s" x="16" y="116">Default: resourceregistry</text><text class="s" x="16" y="145">Resource XACML policies and blob versions</text></g><g transform="translate(1035 315)"><rect class="c" width="515" height="180" rx="8"/><rect width="515" height="44" rx="8" fill="#8b5e34"/><text class="h" x="16" y="29">Metadata blob account</text><text class="t" x="16" y="86">MetadataContainer</text><text class="s" x="16" y="116">Default: metadata</text><text class="s" x="16" y="145">Altinn app XACML policies</text></g><path class="a" d="M340 280H430"/><path class="a" d="M340 300C650 300 720 145 1025 145"/><path class="a" d="M340 325C675 325 720 405 1025 405"/><text class="s" x="40" y="655">Source commit 8cc7866 · current implementation before the planned move to altinn-authorization-tmp.</text></svg>