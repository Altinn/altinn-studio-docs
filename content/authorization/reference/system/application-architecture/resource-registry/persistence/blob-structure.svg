<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760" role="img"><title>Resource Registry blob containers and policy paths</title><style>.bg{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 20px system-ui;fill:#fff}.t{font:15px system-ui;fill:#172033}.m{font:15px ui-monospace,monospace;fill:#172033}.n{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#x)}</style><defs><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect class="bg" width="1700" height="760"/><g transform="translate(45 250)"><rect class="b" width="350" height="190" rx="8"/><rect width="350" height="44" rx="8" fill="#1e3a5f"/><text class="h" x="15" y="29">PolicyRepository</text><text class="t" x="15" y="86">Reads, writes and deletes</text><text class="t" x="15" y="118">XACML policy documents</text><text class="n" x="15" y="155">Blob leases coordinate updates</text></g><g transform="translate(510 70)"><rect class="b" width="560" height="285" rx="8"/><rect width="560" height="44" rx="8" fill="#6d4c8d"/><text class="h" x="15" y="29">ResourceRegistryContainer</text><text class="t" x="15" y="82">Default container: resourceregistry</text><text class="m" x="15" y="130">&lt;resource ID&gt;/</text><text class="m" x="45" y="168">resourcepolicy.xml</text><text class="n" x="45" y="203">current blob</text><text class="n" x="45" y="232">version ID → previous blob version</text><text class="n" x="15" y="266">Resource ID is retained as a path</text></g><g transform="translate(510 430)"><rect class="b" width="560" height="245" rx="8"/><rect width="560" height="44" rx="8" fill="#8b5e34"/><text class="h" x="15" y="29">MetadataContainer</text><text class="t" x="15" y="82">Default container: metadata</text><text class="m" x="15" y="130">&lt;organisation&gt;/&lt;app&gt;/</text><text class="m" x="45" y="168">policy.xml</text><text class="n" x="15" y="211">Shared Altinn app-policy layout</text></g><g transform="translate(1200 150)"><rect class="b" width="450" height="355" rx="8"/><rect width="450" height="44" rx="8" fill="#0f766e"/><text class="h" x="15" y="29">PostgreSQL link</text><text class="m" x="15" y="86">resource_identifier</text><text class="m" x="35" y="124">identifier</text><text class="m" x="35" y="162">policy_uploaded</text><text class="n" x="15" y="210">The identifier determines the blob path.</text><text class="n" x="15" y="244">policy_uploaded marks whether a resource</text><text class="n" x="15" y="270">has received a policy.</text><text class="n" x="15" y="318">No blob path or version ID is stored</text><text class="n" x="15" y="344">in PostgreSQL.</text></g><path class="a" d="M395 300C450 300 450 210 500 210"/><path class="a" d="M395 370C450 370 450 550 500 550"/><path class="a" d="M1190 270H1080"/><text class="n" x="45" y="725">Account names, endpoints and container names are configurable per environment.</text></svg>