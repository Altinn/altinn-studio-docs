<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930" role="img"><title>Resource model in the resourceregistry schema</title><style>.bg{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.hd{fill:#0f766e}.vh{fill:#475569}.h{font:700 19px system-ui;fill:#fff}.t{font:14px ui-monospace,monospace;fill:#172033}.n{font:13px system-ui;fill:#475569}.fk{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#a)}.dep{stroke:#64748b;stroke-width:2;fill:none}.logical{stroke:#9a3412;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect class="bg" width="1800" height="930"/><text x="40" y="42" class="h" style="fill:#172033">PostgreSQL schema: resourceregistry · resources and derived subjects</text><g transform="translate(55 105)"><rect class="b" width="510" height="310" rx="7"/><rect class="hd" width="510" height="44" rx="7"/><text class="h" x="15" y="29">resource_identifier</text><text class="t" x="15" y="78">PK identifier             text</text><text class="t" x="15" y="110">   created                timestamptz NOT NULL</text><text class="t" x="15" y="142">UQ global_change_id       bigint NOT NULL</text><text class="t" x="15" y="174">   last_changed           timestamptz NOT NULL</text><text class="t" x="15" y="206">   policy_uploaded        boolean NOT NULL</text><text class="t" x="15" y="238">   deleted                boolean NOT NULL</text><text class="n" x="15" y="280">One row per durable resource identity</text></g><g transform="translate(700 105)"><rect class="b" width="520" height="310" rx="7"/><rect class="hd" width="520" height="44" rx="7"/><text class="h" x="15" y="29">resources</text><text class="t" x="15" y="78">PK version_id             bigint (bigserial)</text><text class="t" x="15" y="110">FK identifier             text NOT NULL</text><text class="t" x="15" y="142">   created                timestamptz NOT NULL</text><text class="t" x="15" y="174">   modified               timestamptz</text><text class="t" x="15" y="206">   serviceresourcejson    jsonb NOT NULL</text><text class="n" x="15" y="250">Index: identifier, version_id DESC</text><text class="n" x="15" y="280">Every metadata update appends a version</text></g><path class="fk" d="M700 215H575"/><text class="n" x="610" y="198">identifier</text><g transform="translate(1320 105)"><rect class="b" width="420" height="190" rx="7"/><rect class="vh" width="420" height="44" rx="7"/><text class="h" x="15" y="29">current_resources (view)</text><text class="t" x="15" y="82">Latest resources row</text><text class="t" x="15" y="114">per identifier</text><text class="n" x="15" y="157">DISTINCT ON, version_id DESC</text></g><path class="dep" d="M1320 205H1230"/><g transform="translate(425 540)"><rect class="b" width="880" height="315" rx="7"/><rect class="hd" width="880" height="44" rx="7"/><text class="h" x="15" y="29">resourcesubjects</text><text class="t" x="15" y="82">PK resource_urn           text              PK subject_urn            text</text><text class="t" x="15" y="118">   resource_type          text                 subject_type           text</text><text class="t" x="15" y="154">   resource_value         text                 subject_value          text</text><text class="t" x="15" y="190">   resource_owner         text</text><text class="t" x="15" y="226">   updated_at             timestamptz DEFAULT current timestamp</text><text class="t" x="15" y="262">   deleted                boolean DEFAULT false</text><text class="n" x="15" y="296">No database foreign key to resource_identifier or resources</text></g><path class="logical" d="M865 540V450H310V425"/><text class="n" x="890" y="475">logical relation through resource URN/value</text><text class="n" x="55" y="895">Blue arrows: enforced database relation · dashed line: application-level relation · selected indexes shown.</text></svg>