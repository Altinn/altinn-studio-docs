<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="760" viewBox="0 0 1750 760" role="img"><title>Access Management UI storage boundary</title><style>.g{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 19px system-ui;fill:#fff}.t{font:15px system-ui;fill:#172033}.n{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect class="g" width="1750" height="760"/><g transform="translate(40 120)"><rect class="b" width="420" height="430" rx="8"/><rect width="420" height="44" rx="8" fill="#6d4c8d"/><text class="h" x="15" y="29">Browser · React client</text><text class="t" x="15" y="90">Cookies</text><text class="n" x="15" y="120">JWT, XSRF, party and language context</text><text class="t" x="15" y="180">Redux Toolkit / RTK Query</text><text class="n" x="15" y="210">In-memory UI state and API response cache</text><text class="n" x="15" y="270">No localStorage</text><text class="n" x="15" y="300">No sessionStorage or IndexedDB</text><text class="n" x="15" y="330">No Redux Persist</text></g><g transform="translate(620 170)"><rect class="b" width="430" height="330" rx="8"/><rect width="430" height="44" rx="8" fill="#1e3a5f"/><text class="h" x="15" y="29">ASP.NET Core BFF</text><text class="t" x="15" y="90">IMemoryCache</text><text class="n" x="15" y="120">Process-local, non-durable cache</text><text class="n" x="15" y="155">Resource metadata, owners and roles</text><text class="n" x="15" y="190">Default absolute expiry: 10 minutes</text><text class="t" x="15" y="250">No owned database, queue or blob</text></g><g transform="translate(1210 85)"><rect class="b" width="490" height="500" rx="8"/><rect width="490" height="44" rx="8" fill="#0f766e"/><text class="h" x="15" y="29">Authoritative backend services</text><text class="t" x="15" y="90">Access Management</text><text class="t" x="15" y="130">Register and Profile</text><text class="t" x="15" y="170">Resource Registry</text><text class="t" x="15" y="210">Authentication</text><text class="t" x="15" y="250">Maskinporten</text><text class="t" x="15" y="290">System-user services</text><text class="n" x="15" y="355">These services own persistent business data.</text><text class="n" x="15" y="390">The BFF reads and changes data through APIs.</text></g><path class="a" d="M460 330H610"/><path class="a" d="M1050 330H1200"/><text class="n" x="40" y="710">Source commit 8539d5b · caches are optimisation layers and must not be treated as sources of truth.</text></svg>