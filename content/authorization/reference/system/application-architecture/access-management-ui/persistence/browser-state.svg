<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img"><title>Access Management UI browser state</title><style>.g{fill:#f7f8fa}.b{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 18px system-ui;fill:#fff}.t{font:14px ui-monospace,monospace;fill:#172033}.n{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect class="g" width="1800" height="900"/><g transform="translate(45 90)"><rect class="b" width="560" height="620" rx="8"/><rect width="560" height="44" rx="8" fill="#6d4c8d"/><text class="h" x="15" y="29">Browser cookies</text><text class="t" x="15" y="90">AltinnStudioRuntime</text><text class="n" x="30" y="120">JWT authentication context</text><text class="t" x="15" y="175">XSRF-TOKEN</text><text class="n" x="30" y="205">Anti-forgery request token</text><text class="t" x="15" y="260">AltinnPartyId · AltinnPartyUuid</text><text class="n" x="30" y="290">Represented-party context</text><text class="t" x="15" y="345">selectedLanguage · altinnPersistentContext</text><text class="n" x="30" y="375">Language context</text><text class="t" x="15" y="430">AltinnLogoutInfo</text><text class="n" x="30" y="460">Safe redirect or request context at logout</text></g><g transform="translate(740 150)"><rect class="b" width="420" height="430" rx="8"/><rect width="420" height="44" rx="8" fill="#1e3a5f"/><text class="h" x="15" y="29">React state</text><text class="t" x="15" y="95">Redux store</text><text class="t" x="15" y="145">RTK Query caches</text><text class="n" x="15" y="200">Held in JavaScript memory</text><text class="n" x="15" y="235">Recreated after reload</text><text class="n" x="15" y="290">Mutations call BFF APIs</text></g><g transform="translate(1300 230)"><rect class="b" width="450" height="270" rx="8"/><rect width="450" height="44" rx="8" fill="#0f766e"/><text class="h" x="15" y="29">BFF request processing</text><text class="n" x="15" y="90">Validates authentication and XSRF context</text><text class="n" x="15" y="130">Uses represented-party context</text><text class="n" x="15" y="170">Calls authoritative backend APIs</text><text class="n" x="15" y="210">May refresh or replace cookies</text></g><path class="a" d="M605 350H730"/><path class="a" d="M1160 360H1290"/><text class="n" x="45" y="850">Cookies and React state support the user session; they do not replace backend authorisation checks or persistent domain storage.</text></svg>