40' height='36' rx='7'/><text class='n' x='1202' y='624'>oidc_session</text><text class='r' x='1202' y='664'>sid PK</text><text class='r' x='1202' y='688'>upstream issuer/sub · subject identity</text><text class='r' x='1202' y='712'>session_handle_hash UQ</text><text class='r' x='1202' y='736'>provider · ACR/AMR · scopes</text><text class='r' x='1202' y='760'>provider_claims jsonb</text><text class='r' x='1202' y='784'>lifecycle timestamps</text><text class='r' x='1202' y='808'>upstream_session_sid · diagnostics</text></g><g><rect class='c' x='30' y='1110' width='540' height='175' rx='7'/><rect class='h' x='30' y='1110' width='540' height='36' rx='7'/><text class='n' x='42' y='1134'>refresh_token_family</text><text class='r' x='42' y='1174'>family_id PK</text><text class='r' x='42' y='1198'>client_id · subject_id</text><text class='r' x='42' y='1222'>op_sid FK → oidc_session</text><text class='r' x='42' y='1246'>created/revoked fields</text><text class='r' x='42' y='1270'>UQ client+subject+session</text></g><g><rect class='c' x='610' y='1110' width='540' height='271' rx='7'/><rect class='h' x='610' y='1110' width='540' height='36' rx='7'/><text class='n' x='622' y='1134'>refresh_token</text><text class='r' x='622' y='1174'>token_id PK</text><text class='r' x='622' y='1198'>family_id FK → refresh_token_family</text><text class='r' x='622' y='1222'>op_sid FK → oidc_session</text><text class='r' x='622' y='1246'>status · lookup key UQ</text><text class='r' x='622' y='1270'>hash · salt · iterations</text><text class='r' x='622' y='1294'>client and subject identity</text><text class='r' x='622' y='1318'>scopes · ACR/AMR · claims</text><text class='r' x='622' y='1342'>expiry · rotation · revocation</text><text class='r' x='622' y='1366'>diagnostic hashes</text></g><g><rect class='c' x='1190' y='1110' width='540' height='223' rx='7'/><rect class='h' x='1190' y='1110' width='540' height='36' rx='7'/><text class='n' x='1202' y='1134'>selfidentified_user_credential</text><text class='r' x='1202' y='1174'>user_id PK</text><text class='r' x='1202' y='1198'>user_name UQ</text><text class='r' x='1202' y='1222'>party_uuid</text><text class='r' x='1202' y='1246'>password_hash · salt · password_expiry</text><text class='r' x='1202' y='1270'>email · is_active · altinn2_user_id</text><text class='r' x='1202' y='1294'>imported_at</text><text class='r' x='1202' y='1318'>failed_login_attempts · lockout_until</text></g><rect x='30' y='1580' width='1740' height='38' rx='6' fill='#e8eef6'/><text class='x' x='45' y='1604'>Simplified physical model. Indexes, checks, domains, triggers and functions are described on the documentation page.</text></svg>