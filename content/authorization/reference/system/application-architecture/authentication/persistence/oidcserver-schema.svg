<svg xmlns='http://www.w3.org/2000/svg' width='1800' height='1640' viewBox='0 0 1800 1640' role='img'><title>Authentication oidcserver database model</title><style>.b{fill:#f7f8fa}.c{fill:#fff;stroke:#334155;stroke-width:1.5}.h{fill:#1e3a5f}.n{font:700 16px system-ui;fill:#fff}.r{font:13px ui-monospace,monospace;fill:#172033}.x{font:14px system-ui;fill:#334155}.g{font:700 21px system-ui;fill:#1e3a5f}</style><rect class='b' width='1800' height='1640'/><text class='g' x='30' y='36'>PostgreSQL schema: oidcserver</text><text class='x' x='30' y='62'>PK = primary key · FK = foreign key · UQ = unique · source commit e581d8d</text><g><rect class='c' x='30' y='90' width='540' height='223' rx='7'/><rect class='h' x='30' y='90' width='540' height='36' rx='7'/><text class='n' x='42' y='114'>client</text><text class='r' x='42' y='154'>client_id PK</text><text class='r' x='42' y='178'>client_name · client_type</text><text class='r' x='42' y='202'>token_endpoint_auth_method</text><text class='r' x='42' y='226'>redirect_uris[] · allowed_scopes[]</text><text class='r' x='42' y='250'>secret hash and expiry</text><text class='r' x='42' y='274'>jwks_uri · jwks jsonb</text><text class='r' x='42' y='298'>logout URIs · timestamps</text></g><g><rect class='c' x='610' y='90' width='540' height='175' rx='7'/><rect class='h' x='610' y='90' width='540' height='36' rx='7'/><text class='n' x='622' y='114'>unregistered_client_request</text><text class='r' x='622' y='154'>request_id PK</text><text class='r' x='622' y='178'>status · lifecycle timestamps</text><text class='r' x='622' y='202'>issuer · goto_url</text><text class='r' x='622' y='226'>upstream_request_id UQ</text><text class='r' x='622' y='250'>correlation and diagnostics</text></g><g><rect class='c' x='1190' y='90' width='540' height='223' rx='7'/><rect class='h' x='1190' y='90' width='540' height='36' rx='7'/><text class='n' x='1202' y='114'>login_transaction</text><text class='r' x='1202' y='154'>request_id PK</text><text class='r' x=