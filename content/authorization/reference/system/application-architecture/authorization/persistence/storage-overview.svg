<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img"><title>Authorization persistence overview</title><style>.b{fill:#f7f8fa}.c{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 19px system-ui;fill:#fff}.t{font:15px system-ui;fill:#172033}.s{font:13px system-ui;fill:#475569}</style><rect class="b" width="1600" height="760"/><g transform="translate(35 50)"><rect class="c" width="300" height="150" rx="8"/><rect width="300" height="42" rx="8" fill="#1e3a5f"/><text class="h" x="15" y="28">Authorization / PDP</text><text class="t" x="15" y="80">Decision and delegation APIs</text><text class="t" x="15" y="112">Context enrichment</text></g><g transform="translate(390 25)"><rect class="c" width="480" height="205" rx="8"/><rect width="480" height="42" rx="8" fill="#0f766e"/><text class="h" x="15" y="28">PostgreSQL · owned</text><text class="t" x="15" y="82">delegation.delegationchanges · 1 table</text><text class="s" x="15" y="114">Change metadata, policy path and optional version</text><text class="s" x="15" y="146">Raw Npgsql functions and repositories</text><text class="s" x="15" y="176">Empty EF model; baseline migration only</text></g><g transform="translate(925 25)"><rect class="c" width="630" height="205" rx="8"/><rect width="630" height="42" rx="8" fill="#6d4c8d"/><text class="h" x="15" y="28">Azure Blob Storage · owned/read-write</text><text class="t" x="15" y="82">MetadataContainer · app/resource policy.xml</text><text class="t" x="15" y="116">DelegationsContainer · delegationpolicy.xml</text><text class="s" x="15" y="150">Versioning and blob leases</text><text class="s" x="15" y="178">Default names: metadata and delegationpolicies</text></g><g transform="translate(390 300)"><rect class="c" width="480" height="180" rx="8"/><rect width="480" height="42" rx="8" fill="#8a4b08"/><text class="h" x="15" y="28">Azure Storage Queue · write</text><text class="t" x="15" y="84">authorizationeventlog</text><text class="s" x="15" y="118">Authorization events sent to Audit Log</text><text class="s" x="15" y="148">Queue-message TTL: 90 days</text></g><g transform="translate(925 300)"><rect class="c" width="630" height="180" rx="8"/><rect width="630" height="42" rx="8" fill="#2563a6"/><text class="h" x="15" y="28">IMemoryCache · local and non-durable</text><text class="t" x="15" y="84">Parsed policies, parties, profiles and roles</text><text class="s" x="15" y="118">Resource Registry and Access Management responses</text><text class="s" x="15" y="148">Per-process state with configured expiration</text></g><g transform="translate(390 550)"><rect class="c" width="1165" height="135" rx="8" stroke-dasharray="8 5"/><rect width="1165" height="42" rx="8" fill="#64748b"/><text class="h" x="15" y="28">External read sources · not owned by PDP</text><text class="t" x="15" y="82">Register · Resource Registry · Access Management · Profile · Storage instance metadata</text><text class="s" x="15" y="112">The PDP reads these services through HTTP clients; their databases belong to the source components.</text></g><path d="M335 120H385M335 140Q650 40 920 125M335 150Q360 390 385 390M335 165Q700 250 920 390M335 180Q650 650 385 620" fill="none" stroke="#64748b" stroke-width="2"/></svg>