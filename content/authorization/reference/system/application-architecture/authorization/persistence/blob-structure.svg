<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img"><title>Authorization blob storage structure</title><style>.b{fill:#f7f8fa}.c{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 20px system-ui;fill:#fff}.t{font:16px system-ui;fill:#172033}.m{font:14px ui-monospace,monospace;fill:#334155}.s{font:14px system-ui;fill:#475569}</style><rect class="b" width="1500" height="720"/><g transform="translate(40 55)"><rect class="c" width="660" height="495" rx="8"/><rect width="660" height="44" rx="8" fill="#0f766e"/><text class="h" x="16" y="29">MetadataContainer · default metadata</text><text class="t" x="18" y="84">Application and resource policies</text><text class="m" x="18" y="126">{org}/{app}/policy.xml</text><text class="m" x="18" y="160">{resource-id}/policy.xml</text><text class="t" x="18" y="210">Selected when the path does not contain</text><text class="m" x="18" y="242">delegationpolicy.xml</text><text class="s" x="18" y="298">Read by the policy retrieval point.</text><text class="s" x="18" y="328">Parsed policies are cached in local process memory.</text><text class="s" x="18" y="378">Resource Registry policies may instead be read through</text><text class="s" x="18" y="404">the Resource Registry API and are not owned here.</text></g><g transform="translate(800 55)"><rect class="c" width="660" height="495" rx="8"/><rect width="660" height="44" rx="8" fill="#6d4c8d"/><text class="h" x="16" y="29">DelegationsContainer · default delegationpolicies</text><text class="t" x="18" y="84">Versioned delegation policies</text><text class="m" x="18" y="126">{org}/{app}/{from}/{to}/delegationpolicy.xml</text><text class="m" x="18" y="160">{resource}/{from}/{to}/delegationpolicy.xml</text><text class="m" x="18" y="194">…/Instance{uuid}/{party-type}{uuid}/delegationpolicy.xml</text><text class="s" x="18" y="250">The exact path varies by delegation type.</text><text class="s" x="18" y="290">PostgreSQL stores the path and optional blob version ID.</text><text class="s" x="18" y="330">Blob leases coordinate conditional updates.</text><text class="s" x="18" y="370">Older versions can be read or deleted explicitly.</text></g><text class="s" x="40" y="625">Container and account names are environment configuration. Routing is based on whether the blob name contains delegationpolicy.xml.</text><text class="s" x="40" y="655">Source commit 20fcb3f.</text></svg>