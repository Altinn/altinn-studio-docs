<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img"><title>Authorization delegation database schema</title><style>.b{fill:#f7f8fa}.c{fill:#fff;stroke:#334155;stroke-width:2}.h{fill:#1e3a5f}.n{font:700 20px system-ui;fill:#fff}.r{font:16px ui-monospace,monospace;fill:#172033}.t{font:15px system-ui;fill:#475569}</style><rect class="b" width="1300" height="720"/><text class="n" x="35" y="42" style="fill:#1e3a5f">PostgreSQL schema: delegation</text><g transform="translate(55 90)"><rect class="c" width="560" height="420" rx="8"/><rect class="h" width="560" height="45" rx="8"/><text class="n" x="16" y="30">delegationchanges</text><text class="r" x="18" y="82">delegationchangeid bigint PK · identity</text><text class="r" x="18" y="116">delegationchangetype enum</text><text class="r" x="18" y="150">altinnappid varchar</text><text class="r" x="18" y="184">offeredbypartyid integer</text><text class="r" x="18" y="218">coveredbypartyid integer?</text><text class="r" x="18" y="252">coveredbyuserid integer?</text><text class="r" x="18" y="286">performedbyuserid integer</text><text class="r" x="18" y="320">blobstoragepolicypath varchar</text><text class="r" x="18" y="354">blobstorageversionid varchar?</text><text class="r" x="18" y="388">created timestamptz</text></g><g transform="translate(700 110)"><rect class="c" width="540" height="315" rx="8"/><rect class="h" width="540" height="45" rx="8"/><text class="n" x="16" y="30">Database functions</text><text class="r" x="18" y="82">insert_delegationchange</text><text class="r" x="18" y="116">get_current_change</text><text class="r" x="18" y="150">get_all_changes</text><text class="r" x="18" y="184">get_all_current_changes_*</text><text class="r" x="18" y="218">select_delegationchanges_by_id_range</text><text class="t" x="18" y="265">Raw Npgsql repositories call these functions.</text><text class="t" x="18" y="291">EF applies the baseline but models no entities.</text></g><path d="M700 265H620" stroke="#64748b" stroke-width="2"/><text class="t" x="55" y="570">Indexes: altinnappid, offeredbypartyid, coveredbypartyid and coveredbyuserid.</text><text class="t" x="55" y="600">The table stores blob paths and version IDs; XACML policy contents remain in Azure Blob Storage.</text><text class="t" x="55" y="650">Source commit 20fcb3f · baseline migration 20260622092358.</text></svg>