<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img"><title>Access Management storage overview</title><style>.b{fill:#f7f8fa}.c{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 20px system-ui;fill:#fff}.t{font:15px system-ui;fill:#172033}.s{font:13px system-ui;fill:#475569}</style><rect class="b" width="1600" height="720"/><g transform="translate(35 55)"><rect class="c" width="310" height="145" rx="8"/><rect width="310" height="42" rx="8" fill="#1e3a5f"/><text class="h" x="15" y="28">Access Management</text><text class="t" x="15" y="78">Legacy persistence</text><text class="t" x="15" y="108">EF persistence and workers</text></g><g transform="translate(395 25)"><rect class="c" width="540" height="475" rx="8"/><rect width="540" height="42" rx="8" fill="#0f766e"/><text class="h" x="15" y="28">PostgreSQL</text><text class="t" x="15" y="78">dbo · 34 active tables</text><text class="s" x="15" y="104">Catalogue, entities, roles, packages, assignments and operations</text><text class="t" x="15" y="145">dbo_history · 27 audit tables</text><text class="s" x="15" y="171">Temporal history for audited dbo tables</text><text class="t" x="15" y="212">consent · 6 tables</text><text class="s" x="15" y="238">Requests, rights, events, context and attributes</text><text class="t" x="15" y="279">delegation · 3 legacy change tables</text><text class="s" x="15" y="305">Policy paths, versions and identity changes</text><text class="t" x="15" y="346">accessmanagement · 1 legacy resource table</text><text class="s" x="15" y="372">Resource Registry identifier lookup</text><text class="t" x="15" y="413">connections · database view</text><text class="s" x="15" y="439">Projection across assignments and delegations</text></g><g transform="translate(995 110)"><rect class="c" width="555" height="245" rx="8"/><rect width="555" height="42" rx="8" fill="#6d4c8d"/><text class="h" x="15" y="28">Azure Blob Storage</text><text class="t" x="15" y="82">MetadataContainer</text><text class="s" x="15" y="110">Default configuration: metadata</text><text class="t" x="15" y="151">Delegation policy blobs (XACML)</text><text class="s" x="15" y="179">Paths and version IDs are referenced from PostgreSQL</text><text class="s" x="15" y="207">Blob leases coordinate policy updates</text></g><path d="M345 125H390" stroke="#64748b" stroke-width="2"/><path d="M345 150Q700 50 990 210" fill="none" stroke="#64748b" stroke-width="2"/><text class="s" x="35" y="675">Source commit 20fcb3f · both current EF persistence and legacy storage remain in use during migration.</text></svg>