<svg xmlns='http://www.w3.org/2000/svg' width='1800' height='840' viewBox='0 0 1800 840' role='img'><title>PostgreSQL schema consent</title><style>.b{fill:#f7f8fa}.c{fill:#fff;stroke:#334155;stroke-width:1.5}.h{fill:#1e3a5f}.n{font:700 16px system-ui;fill:#fff}.r{font:13px ui-monospace,monospace;fill:#172033}.x{font:14px system-ui;fill:#334155}.g{font:700 21px system-ui;fill:#1e3a5f}</style><rect class='b' width='1800' height='840'/><text class='g' x='30' y='36'>PostgreSQL schema consent</text><text class='x' x='30' y='62'>PK/FK relationships are represented by Id columns and described on the page · source commit 20fcb3f</text><g><rect class='c' x='30' y='90' width='540' height='199' rx='7'/><rect class='h' x='30' y='90' width='540' height='36' rx='7'/><text class='n' x='42' y='114'>consentrequest</text><text class='r' x='42' y='152'>consentrequestid PK</text><text class='r' x='42' y='176'>party UUIDs</text><text class='r' x='42' y='200'>requestmessage hstore</text><text class='r' x='42' y='224'>template/version</text><text class='r' x='42' y='248'>status · validity timestamps</text><text class='r' x='42' y='272'>portalviewmode</text></g><g><rect class='c' x='610' y='90' width='540' height='151' rx='7'/><rect class='h' x='610' y='90' width='540' height='36' rx='7'/><text class='n' x='622' y='114'>consentevent</text><text class='r' x='622' y='152'>consenteventid PK</text><text class='r' x='622' y='176'>consentrequestid (logical FK)</text><text class='r' x='622' y='200'>eventtype</text><text class='r' x='622' y='224'>created · performedbyparty</text></g><g><rect class='c' x='1190' y='90' width='540' height='127' rx='7'/><rect class='h' x='1190' y='90' width='540' height='36' rx='7'/><text class='n' x='1202' y='114'>consentright</text><text class='r' x='1202' y='152'>consentrightid PK</text><text class='r' x='1202' y='176'>consentrequestid (logical FK)</text><text class='r' x='1202' y='200'>action[]</text></g><g><rect class='c' x='30' y='450' width='540' height='127' r