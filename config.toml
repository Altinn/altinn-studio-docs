baseURL = "https://docs.altinn.studio/"
languageCode = "nb"
defaultContentLanguage = "nb"
defaultContentLanguageInSubdir = true
disableDefaultLanguageRedirect = false

contentDir = "content"
staticDir = "static"
publishDir = "public"

title = "Altinn Studio"
theme = "hugo-theme-altinn"
metadataFormat = "yaml"
pluralizeListTitles = false
preserveTaxonomyNames = true
enableEmoji = true
enableGitInfo = true
disableKinds = ["RSS", "taxonomy", "term"] # page home section taxonomy term RSS sitemap robotsTXT 404

[languages]
  [languages.nb]
    title = "Altinn docs"
    languageName = "Bokmål"
    weight = 1
  [languages.en]
    title = "Altinn docs"
    languageName = "English"
    weight = 2
# [languages.nn]
#   title = "Altinn"
#   languageName = "Nynorsk"
#   weight = 3

[markup.goldmark]
duplicateResourceFiles = true

[markup.goldmark.parser]
autoHeadingIDType = "github"

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "dracula"

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = false

[blackfriday]
fractions = false # disable automatic fraction rendering

[params]
editURL = "https://github.com/altinn/altinn-studio-docs/blob/master/content/"
componentPropertiesBaseURL = "https://raw.githubusercontent.com/Altinn/altinn-studio/main/src/common/ts/layout-contract/docs/components"
noHomeIcon = true # default is false
noSearch = false # default is false
showVisitedLinks = false # default is false
enableMermaid = true # enable Mermaid diagrams

[outputFormats.LLMS]
baseName = "llms"
mediaType = "text/plain"
isPlainText = true

[outputs]
home = ["HTML", "JSON", "LLMS"]
page = ["HTML", "MARKDOWN"]
section = ["HTML", "MARKDOWN"]

# Mapper Hugo leser fra. Når vi legger til egne mounts, må standardmappene også listes opp.
# CSS-en til Designsystemet og ikonene fra Aksel hentes fra node_modules (npm ci) og brukes av forsiden for Altinn Studio v9.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "node_modules/@digdir/designsystemet-css/dist/src"
    target = "assets/vendor/designsystemet-css"
  [[module.mounts]]
    source = "node_modules/@navikt/aksel-icons/dist/svg"
    target = "assets/vendor/aksel-icons"
