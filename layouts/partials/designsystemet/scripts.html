<script src="/pagefind/pagefind-ui.js"></script>
<script>
  // Søk med Pagefind i Dialog fra Designsystemet. Søket starter første gang dialogen åpnes.
  (function () {
    var dialog = document.getElementById('ds-site-search');
    if (!dialog) return;
    var started = false;
    dialog.addEventListener('toggle', function () {
      if (!dialog.open) return;
      if (!started && window.PagefindUI) {
        new PagefindUI({ element: '#ds-site-search-ui', pageSize: 10, excerptLength: 25, showSubResults: true, showImages: false });
        started = true;
      }
      var input = dialog.querySelector('.pagefind-ui__search-input');
      if (input) {
        input.setAttribute('aria-label', '{{ T "search" }}');
        input.focus();
      }
    });
  })();
</script>
