<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{{ .Title }} | Altinn docs</title>
<style>
:root{color-scheme:light;--ink:#022f51;--accent:#0062ba}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font-family:Arial,sans-serif}main{max-width:1280px;margin:auto}.slide{min-height:calc(100vh - 88px);padding:clamp(28px,5vw,72px);background:white}.slide[hidden]{display:none}h1{font-size:clamp(40px,5vw,72px);line-height:1.08;max-width:1000px}h2{font-size:clamp(30px,3.5vw,48px);line-height:1.15;margin:0 0 32px}h3{font-size:28px}p,li{font-size:clamp(19px,2.1vw,27px);line-height:1.5}li{margin-bottom:14px}strong{color:var(--accent)}a{color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:clamp(16px,1.7vw,22px);line-height:1.4}th,td{text-align:left;padding:15px 12px;border-bottom:1px solid #c9d7e2;vertical-align:top}th{background:#eaf4ff}blockquote{border-left:5px solid #1eaef7;margin:28px 0;padding:1px 24px;background:#f4f7fa}code{font-size:.85em}footer{min-height:88px;position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;background:var(--ink);color:white;padding:14px}button{font:inherit;font-size:17px;border:1px solid #8ed8ff;border-radius:4px;background:transparent;color:white;padding:9px 15px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #1eaef7;outline-offset:4px}.help{font-size:14px;color:#dce8f1}.overview .slide{display:block;min-height:0;margin:20px 0;border-bottom:3px solid #1eaef7}.overview .slide[hidden]{display:block}@media(max-width:650px){.slide{padding:28px 20px}table{font-size:16px}th,td{padding:10px 6px}.help{display:none}footer{gap:8px}}@media print{footer{display:none}.slide,.slide[hidden]{display:block;break-after:page;min-height:0;padding:20px}h2{font-size:30px}p,li{font-size:18px}table{font-size:15px}@page{size:A4 landscape;margin:15mm}}
</style>
</head>
<body data-pagefind-ignore="all">
<main aria-label="Diskusjonsgrunnlag om systembruker">
{{ range $i, $slide := split .RawContent "\n---\n" }}
<section class="slide" id="slide-{{ add $i 1 }}" tabindex="-1" aria-label="Lysbilde {{ add $i 1 }}">{{ $slide | markdownify }}</section>
{{ end }}
</main>
<footer aria-label="Presentasjonskontroller"><button id="prev" aria-label="Forrige lysbilde">← Forrige</button><span id="position" role="status" aria-live="polite"></span><button id="next" aria-label="Neste lysbilde">Neste →</button><button id="overview" aria-pressed="false">Vis alle</button><button id="fullscreen">Fullskjerm</button><span class="help">Piltaster · Home/End · Esc for oversikt · Skriv ut til PDF</span></footer>
<script>
(()=>{const slides=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),overview=document.getElementById('overview');let current=0,all=false;function render(focus=false){slides.forEach((s,i)=>s.hidden=!all&&i!==current);document.body.classList.toggle('overview',all);document.getElementById('position').textContent=`${current+1} / ${slides.length}`;prev.disabled=current===0;next.disabled=current===slides.length-1;overview.setAttribute('aria-pressed',String(all));overview.textContent=all?'Vis ett':'Vis alle';if(focus&&!all)slides[current].focus();}function go(i){current=Math.max(0,Math.min(slides.length-1,i));history.replaceState(null,'',`#slide-${current+1}`);render(true);}function fromHash(){const n=Number(location.hash.replace('#slide-',''));current=Number.isInteger(n)&&n>0&&n<=slides.length?n-1:0;render();}prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);overview.onclick=()=>{all=!all;render();};document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('position').textContent='Fullskjerm er ikke tilgjengelig i denne nettleseren';}};document.addEventListener('keydown',e=>{if(e.target.closest('button,a,input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home','End','Escape'].includes(e.key))e.preventDefault();if(['ArrowRight','PageDown',' '].includes(e.key))go(current+1);if(['ArrowLeft','PageUp'].includes(e.key))go(current-1);if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key==='Escape'){all=!all;render();}});window.addEventListener('hashchange',fromHash);fromHash();})();
</script>
</body></html>
