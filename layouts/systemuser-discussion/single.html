<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ .Title }} | Altinn docs</title>
  <link rel="stylesheet" href="{{ "css/systemuser-discussion.css" | relURL }}">
</head>
<body data-pagefind-ignore="all">
  <main aria-label="{{ .Params.arialabel | default "Beslutningsgrunnlag om systembruker" }}">
    {{ range $i, $slide := split .Content "<hr>" }}
      <section class="slide" id="slide-{{ add $i 1 }}" tabindex="-1" aria-label="Lysbilde {{ add $i 1 }}">{{ $slide | safeHTML }}</section>
    {{ end }}
  </main>
  <footer aria-label="Presentasjonskontroller">
    <button id="prev" aria-label="Forrige lysbilde">← Forrige</button>
    <span id="position" role="status" aria-live="polite"></span>
    <button id="next" aria-label="Neste lysbilde">Neste →</button>
    <button id="overview" aria-pressed="false">Vis alle</button>
    <button id="fullscreen">Fullskjerm</button>
    <span class="help">Piltaster · Home/End · Esc for oversikt · Skriv ut til PDF</span>
  </footer>
  <script src="{{ "js/systemuser-discussion.js" | relURL }}"></script>
</body>
</html>
